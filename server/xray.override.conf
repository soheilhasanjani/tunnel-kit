# Installed as /etc/systemd/system/xray.service.d/20-tunnel-kit.conf
# The official Xray unit runs as nobody and ignores exit 23, so a log-file
# permission error leaves port 443 dead forever. Run as root and keep restarting.
[Service]
User=root
Group=root
Restart=on-failure
RestartPreventExitStatus=
